<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LiveTrack</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <main class="app">
      <div id="map"></div>

      <!-- Top navigation -->
      <nav class="navbar">
        <div class="navbar-left">
          <div class="brand-mark">L</div>

          <div class="brand">
            <span class="brand-name">LiveTrack</span>
            <span class="brand-user" id="current-user-name">
              Not connected
            </span>
          </div>
        </div>

        <div class="navbar-right">
          <div id="connection-status" class="connection-status">
            <span id="status-dot"></span>
            <span id="status-text">Offline</span>
          </div>

          <button
            id="center-button"
            class="nav-button icon-button"
            type="button"
            title="Center on me"
            aria-label="Center map on my location"
            disabled
          >
            ◎
          </button>

          <button
            id="connect-button"
            class="nav-button primary-button"
            type="button"
          >
            Connect
          </button>

          <button
            id="share-button"
            class="nav-button primary-button"
            type="button"
            disabled
          >
            Share
          </button>

          <button
            id="stop-button"
            class="nav-button secondary-button"
            type="button"
            disabled
          >
            Stop
          </button>
        </div>
      </nav>

      <!-- Bottom information -->
      <div class="bottom-pill">
        <span id="people-count">0 people</span>

        <span class="bottom-separator"></span>

        <span id="last-update">Waiting for location</span>
      </div>
    </main>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="/js/app.js"></script>
  </body>
</html>
