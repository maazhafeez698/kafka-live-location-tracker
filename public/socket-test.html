<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket Test</title>
  </head>

  <body>
    <h1>Socket.IO Authentication Test</h1>

    <button id="connect">Connect</button>
    <button id="send-location">Send Location</button>

    <pre id="output"></pre>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      const output = document.getElementById("output");
      const connectButton = document.getElementById("connect");
      const sendLocationButton = document.getElementById("send-location");

      let socket;

      connectButton.addEventListener("click", () => {
        const token = prompt("Enter your MyAuth access token:");

        if (!token) return;

        socket = io("http://localhost:4000", {
          auth: {
            token,
          },
        });

        socket.on("connect", () => {
          output.textContent = `Connected\nSocket ID: ${socket.id}`;
        });

        socket.on("connect_error", (error) => {
          output.textContent = `Connection failed:\n${error.message}`;
        });

        socket.on("disconnect", (reason) => {
          output.textContent += `\nDisconnected: ${reason}`;
        });

        socket.on("server:location:update", (event) => {
          console.log("Location broadcast received:", event);

          output.textContent +=
            `\n\nLocation update received:` +
            `\nUser: ${event.userId}` +
            `\nLatitude: ${event.latitude}` +
            `\nLongitude: ${event.longitude}` +
            `\nTimestamp: ${event.timestamp}`;
        });
      });

      sendLocationButton.addEventListener("click", () => {
        if (!socket || !socket.connected) {
          output.textContent += "\n\nConnect first.";
          return;
        }

        socket.emit(
          "location:update",
          {
            latitude: 31.5204,
            longitude: 74.3587,
          },
          (response) => {
            console.log("Location response:", response);
          },
        );
      });
    </script>
  </body>
</html>
