<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket Test</title>
  </head>

  <body>
    <h1>Socket.IO Authentication Test</h1>

    <button id="connect">Connect</button>

    <pre id="output"></pre>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      const output = document.getElementById("output");
      const connectButton = document.getElementById("connect");

      connectButton.addEventListener("click", () => {
        const token = prompt("Enter your MyAuth access token:");

        if (!token) return;

        const socket = io("http://localhost:4000", {
          auth: {
            token,
          },
        });

        socket.on("connect", () => {
          output.textContent = `Connected\nSocket ID: ${socket.id}`;
        });

        socket.on("connect_error", (error) => {
          output.textContent = `Connection failed:\n${error.message}`;
        });

        socket.on("disconnect", (reason) => {
          output.textContent += `\nDisconnected: ${reason}`;
        });
      });
    </script>
  </body>
</html>
