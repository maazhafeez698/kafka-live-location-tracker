<!doctype html>
<html>
  <body>
    <button onclick="testLocation()">Get Location</button>
    <p id="status">Location permission has not been requested.</p>

    <script>
      const status = document.getElementById("status");

      function testLocation() {
        if (!window.isSecureContext) {
          status.textContent =
            "Open this page through http://localhost, HTTPS, or the project server. Browser geolocation is blocked on insecure pages.";
          return;
        }

        if (!navigator.geolocation) {
          status.textContent = "This browser does not support geolocation.";
          return;
        }

        status.textContent = "Requesting location permission...";

        navigator.geolocation.getCurrentPosition(
          (position) => {
            status.textContent = "Location received. See the browser console for coordinates.";
            console.log(
              "SUCCESS:",
              position.coords.latitude,
              position.coords.longitude,
            );
          },
          (error) => {
            status.textContent =
              error.code === error.PERMISSION_DENIED
                ? "Location access was denied. Allow location for this site in the browser address-bar settings, then try again."
                : `Location unavailable: ${error.message}`;
            console.log("ERROR:", error.code, error.message);
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0,
          },
        );
      }
    </script>
  </body>
</html>
